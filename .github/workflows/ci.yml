# CI for Robinson's Toolkit. No secrets, no calls to any service, read-only token, never pull_request_target.
# Shape copied from Robinson-AI-Systems/neon-mcp .github/workflows/ci.yml @ d396fb4.
# The single merge gate is the final `ci` job: it fails unless every job below succeeded.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (secrets, docs, index, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Public GET only: status/RTC manifest observation, not authenticated D-4 acceptance.
      # Uses tracked pinned origins; no pass, origin overrides or repository write scope.
      - name: Observe deployed RTC fleet (non-certifying, public only)
        run: node scripts/probe-rtc-fleet.mjs --public-observe

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm test

  db:
    name: db (throwaway Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Official pinned Postgres major; public ECR mirror exhausted its shared data quota.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/ci-phase.mjs --budget-seconds 180 -- npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres

  stripe-source-sql:
    name: stripe source SQL (reviewed immutable commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout private Toolkit source for installed-core SQL rehearsal
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout independently reviewed Stripe service source (no service writes)
        uses: actions/checkout@v5
        with:
          repository: Robinson-AI-Systems/stripe-mcp
          ref: a38a325f07bdb993b46dc82d85e835d06281aff0
          path: source-stripe
          persist-credentials: false
      - name: Refuse source drift or substituted checkout
        working-directory: source-stripe
        run: test "$(git rev-parse HEAD)" = "a38a325f07bdb993b46dc82d85e835d06281aff0"
      - name: Verify exact reviewed original Stripe OAuth/key test blobs
        working-directory: source-stripe
        run: |
          test "$(git hash-object tests/unit/oauth-handlers.test.js)" = "217c0c18a0c427963fa374aa4c6fad570747865f"
          test "$(git hash-object tests/unit/keys.test.js)" = "05574eecb0d0f246f0ddfd9a9bddb673bd75c5f0"
          test "$(git hash-object src/core/rtc-route.js)" = "7833386fd04717dc137f06132c0caf3c375f6362"
          test "$(git hash-object src/core/rtc-http.js)" = "a0744561ae0b4d0ad9a0b335a4ea9d992a5b6420"
          test "$(git hash-object src/core/rtc-passes.js)" = "e5f261835b72266b575985b0fd8c7adf02c0d4bf"
          test "$(git hash-object src/core/browser-cors.js)" = "e4b5d948a83737344c53079912dc148b4227ef60"
          test "$(git hash-object tests/db/rtc-passes.test.js)" = "57b3a20bf2db9c2ae3eb55bcaac3a453cd70a655"
          test "$(git hash-object tests/db/rtc-rate-limit.test.js)" = "d38647eb208a6e80a3c04c5eb918720ada9b870f"
          test "$(git hash-object tests/unit/rtc-http.test.js)" = "877944f80273fe3198a7a47471b91c56dd9ec8b4"
          test "$(git hash-object tests/unit/rtc-passes.test.js)" = "a7414d868356745de0b6ba1572f649e13280a799"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Toolkit private package tooling without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install exact source lockfile without lifecycle scripts
        working-directory: source-stripe
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute authentic source OAuth and money SQL against throwaway PostgreSQL
        working-directory: source-stripe
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
        run: >-
          npm run test:db --
          tests/db/oauth-persistent.test.js
          tests/db/oauth.test.js
          tests/db/money-owner-approval.test.js
          tests/db/money-reservation.test.js
          tests/db/owner-money-limit.test.js
          tests/db/rtc-passes.test.js
          tests/db/rtc-rate-limit.test.js
      - name: Rehearse original Stripe SQL with privately installed core imports
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
        run: node scripts/stripe-original-service-adopter.mjs --with-sql

  stripe-source-owner-http:
    name: stripe source owner HTTP (reviewed immutable commit)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout private Toolkit source for bounded real-source differential
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout original service HTTP and owner handlers without service writes
        uses: actions/checkout@v5
        with:
          repository: Robinson-AI-Systems/stripe-mcp
          ref: a38a325f07bdb993b46dc82d85e835d06281aff0
          path: source-stripe
          persist-credentials: false
      - name: Verify immutable reviewed service revision
        working-directory: source-stripe
        run: test "$(git rev-parse HEAD)" = "a38a325f07bdb993b46dc82d85e835d06281aff0"
      - name: Verify exact reviewed original Stripe OAuth/key test blobs
        working-directory: source-stripe
        run: |
          test "$(git hash-object tests/unit/oauth-handlers.test.js)" = "217c0c18a0c427963fa374aa4c6fad570747865f"
          test "$(git hash-object tests/unit/keys.test.js)" = "05574eecb0d0f246f0ddfd9a9bddb673bd75c5f0"
          test "$(git hash-object src/core/rtc-route.js)" = "7833386fd04717dc137f06132c0caf3c375f6362"
          test "$(git hash-object src/core/rtc-http.js)" = "a0744561ae0b4d0ad9a0b335a4ea9d992a5b6420"
          test "$(git hash-object src/core/rtc-passes.js)" = "e5f261835b72266b575985b0fd8c7adf02c0d4bf"
          test "$(git hash-object src/core/browser-cors.js)" = "e4b5d948a83737344c53079912dc148b4227ef60"
          test "$(git hash-object tests/db/rtc-passes.test.js)" = "57b3a20bf2db9c2ae3eb55bcaac3a453cd70a655"
          test "$(git hash-object tests/db/rtc-rate-limit.test.js)" = "d38647eb208a6e80a3c04c5eb918720ada9b870f"
          test "$(git hash-object tests/unit/rtc-http.test.js)" = "877944f80273fe3198a7a47471b91c56dd9ec8b4"
          test "$(git hash-object tests/unit/rtc-passes.test.js)" = "a7414d868356745de0b6ba1572f649e13280a799"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install original service lockfile
        working-directory: source-stripe
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute source OAuth owner login and independent money approval HTTP tests
        working-directory: source-stripe
        run: >-
          npx --no-install vitest run --config vitest.config.js
          tests/unit/oauth-handlers.test.js
          tests/unit/money-owner-approval.test.js
          tests/unit/owner-money-limit.test.js
          tests/unit/setup-page.test.js
          tests/unit/owner-test-smoke.test.js
          tests/unit/rtc-http.test.js
          tests/unit/rtc-passes.test.js
      - name: Compare authentic source HTTP with the private portable boundary
        run: node scripts/stripe-source-http-differential.mjs
      - name: Pack core privately and compare installed leaves to original Stripe
        run: node scripts/stripe-source-packed-leaves.mjs
      - name: Rehearse actual original Stripe handler imports through installed private core
        run: node scripts/stripe-original-service-adopter.mjs

  ci:
    name: ci
    if: always()
    needs: [check, unit, db, stripe-source-sql, stripe-source-owner-http]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          CHECK: ${{ needs.check.result }}
          UNIT: ${{ needs.unit.result }}
          DB: ${{ needs.db.result }}
          STRIPE_SOURCE_SQL: ${{ needs.stripe-source-sql.result }}
          STRIPE_SOURCE_OWNER_HTTP: ${{ needs.stripe-source-owner-http.result }}
        run: |
          echo "check=$CHECK unit=$UNIT db=$DB stripe-source-sql=$STRIPE_SOURCE_SQL stripe-source-owner-http=$STRIPE_SOURCE_OWNER_HTTP"
          test "$CHECK" = success
          test "$UNIT" = success
          test "$DB" = success
          test "$STRIPE_SOURCE_SQL" = success
          test "$STRIPE_SOURCE_OWNER_HTTP" = success
